services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    networks:
      - soa-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - soa-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  config-service:
    image: soa-config-service:latest
    container_name: config-service
    build:
      context: ./config-service
      dockerfile: Dockerfile
    ports:
      - "8888:8888"
    environment:
      EUREKA_HOST: discovery-service
    networks:
      - soa-network
    restart: unless-stopped

  discovery-service:
    image: soa-discovery-service:latest
    container_name: discovery-service
    build:
      context: ./discovery-service
      dockerfile: Dockerfile
    ports:
      - "8761:8761"
    environment:
      CONFIG_HOST: config-service
    depends_on:
      - config-service
    networks:
      - soa-network
    restart: unless-stopped

  api-gateway:
    image: soa-api-gateway:latest
    container_name: api-gateway
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      CONFIG_HOST: config-service
      EUREKA_HOST: discovery-service
      COURSE_SERVICE_URL: http://course-service:8082
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-service:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_APPLICATION_JSON: '{"eureka":{"client":{"service-url":{"defaultZone":"http://discovery-service:8761/eureka/"}}}}'
    depends_on:
      - config-service
      - discovery-service
    networks:
      - soa-network
    restart: unless-stopped

  user-service:
    image: soa-user-service:latest
    container_name: user-service
    build:
      context: ./user-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      CONFIG_HOST: config-service
      EUREKA_HOST: discovery-service
      DB_HOST: mysql
      DB_USERNAME: root
      DB_PASSWORD: root
      RABBIT_HOST: rabbitmq
      RABBIT_USERNAME: admin
      RABBIT_PASSWORD: admin
      FRONTEND_URL: http://localhost:3000
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      config-service:
        condition: service_started
      discovery-service:
        condition: service_started
    networks:
      - soa-network
    restart: unless-stopped

  course-service:
    image: soa-course-service:latest
    container_name: course-service
    build:
      context: ./course-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    volumes:
      - ./uploads_data:/app/uploads
    environment:
      CONFIG_HOST: config-service
      EUREKA_HOST: discovery-service
      DB_HOST: mysql
      DB_USERNAME: root
      DB_PASSWORD: root
      RABBIT_HOST: rabbitmq
      RABBIT_USERNAME: admin
      RABBIT_PASSWORD: admin
      UPLOAD_DIR: /app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      config-service:
        condition: service_started
      discovery-service:
        condition: service_started
    networks:
      - soa-network
    restart: unless-stopped

  payment-service:
    image: soa-payment-service:latest
    container_name: payment-service
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    environment:
      CONFIG_HOST: config-service
      EUREKA_HOST: discovery-service
      DB_HOST: mysql
      DB_USERNAME: root
      DB_PASSWORD: root
      RABBIT_HOST: rabbitmq
      RABBIT_USERNAME: admin
      RABBIT_PASSWORD: admin
      ENROLLMENT_SERVICE_URL: http://enrollment-service:8084
      FRONTEND_URL: http://localhost:3000
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      config-service:
        condition: service_started
      discovery-service:
        condition: service_started
    networks:
      - soa-network
    restart: unless-stopped

  enrollment-service:
    image: soa-enrollment-service:latest
    container_name: enrollment-service
    build:
      context: ./enrollment-service
      dockerfile: Dockerfile
    ports:
      - "8084:8084"
    environment:
      CONFIG_HOST: config-service
      EUREKA_HOST: discovery-service
      DB_HOST: mysql
      DB_USERNAME: root
      DB_PASSWORD: root
      RABBIT_HOST: rabbitmq
      RABBIT_USERNAME: admin
      RABBIT_PASSWORD: admin
      COURSE_SERVICE_URL: http://course-service:8082
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      config-service:
        condition: service_started
      discovery-service:
        condition: service_started
    networks:
      - soa-network
    restart: unless-stopped

  notification-service:
    image: soa-notification-service:latest
    container_name: notification-service
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    ports:
      - "8085:8085"
    environment:
      CONFIG_HOST: config-service
      EUREKA_HOST: discovery-service
      RABBIT_HOST: rabbitmq
      RABBIT_USERNAME: admin
      RABBIT_PASSWORD: admin
      FRONTEND_URL: http://localhost:3000
    depends_on:
      rabbitmq:
        condition: service_healthy
      config-service:
        condition: service_started
      discovery-service:
        condition: service_started
    networks:
      - soa-network
    restart: unless-stopped

  frontend:
    image: webbankhoahoc-frontend:latest
    container_name: frontend
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - soa-network
    restart: unless-stopped

volumes:
  mysql-data:

networks:
  soa-network:
    driver: bridge
